    <script>

        })();

                    <div class="search-input-wrapper">

                    </div>
                    <div class="search-results-count" id="resultsCount"></div>
                </div>

                <div id="loadingSpinner" style="text-align: center; padding: 2em;">

                    <p>Loading train schedules...</p>
                </div>
                <div id="schedulesList" style="display: none;"></div>
                <div id="noResults" style="display: none; text-align: center; padding: 2em;">
                    <p><i class="fa-regular fa-inbox"></i> No train schedules found</p>
                </div>
