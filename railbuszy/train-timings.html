    <section class="about-me-sum clearfix">
        <div class="wbnrfz_eicw">
            <div class="page-header-section">
                <div class="container container-xxl container-mobile container-mobile-header">
                    <div class="breadcrumb-wrapper">
                        <nav aria-label="breadcrumb" class="breadcrumb-desktop" style="display: none">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="./index.html" class="breadcrumb-back" aria-label="Back"><i class="fa-regular fa-arrow-left"></i></a></li>
                            </ol>
                        </nav>
                        <div class="page-title-wrapper">
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                                <div class="tt-title-row">
                                    <h1 class="page-title" id="filter-title">Train Timings</h1>
                                    <span class="tt-beta" tabindex="0" role="note" aria-label="Scheduled timings may be inaccurate." data-tip="Scheduled timings are based on the published timetable and may be inaccurate.">

                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>
            </div>

    <section class="pdf-section">
        <div class="container">
            <div class="selector-section">
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <i class="fa-regular fa-search" style="position: absolute; left: 12px; top: 65%; transform: translateY(-65%); color: #cccccc; z-index: 1;"></i>
                        <input type="text" id="stationSearch" class="search-input" placeholder="Enter station name or code" autocomplete="on">
                        <button class="clear-search" id="clearSearch" title="Clear search">&times;</button>
                    </div>
                    <div class="search-results-count" id="resultsCount"></div>
                </div>
                <div class="fl-station-results" id="stationResults"></div>
                <select id="stationDropdown" hidden>
                    <option value="">Loading stations...</option>
                </select>
            </div>

            <div class="tt-toolbar" id="ttToolbar" hidden>
                <div class="tt-filter" id="lineFilter" role="tablist" aria-label="Filter by line"></div>
                <a class="tt-fl-btn" id="flLink" href="../rail-buddy/first-last.html" title="First &amp; last trains" aria-label="First and last trains">
                    <i class="fa-regular fa-clock"></i>
                </a>
            </div>

            <div class="content-section" id="contentSection">
                <div class="tt-top">
                    <div class="tt-top-text">
                        <div class="station-title" id="stationTitle">--</div>
                        <div class="station-subtitle" id="stationSubtitle">Select a station to begin</div>
                    </div>
                </div>
                <div class="tt-meta" id="ttMeta"></div>
                <div class="tt-banner" id="disruptionBanner" hidden></div>
                <div id="directionsContainer"></div>
            </div>

            <div class="empty-state-placeholder" id="emptyStatePlaceholder">
                <i class="fa-kit fa-lta-train" aria-hidden="true"></i>
                <p>Search or select a station above to see its scheduled train timings.</p>
            </div>
        </div>
    </section>
